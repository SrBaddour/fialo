# Blueprint de Render — despliega Fíalo (web) + PostgreSQL gratis.
# Render lee este archivo al crear el servicio desde el repo y lo configura todo.

databases:
  - name: fialo-db
    plan: free
    databaseName: fialo
    user: fialo

services:
  - type: web
    name: fialo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Conexión a la base PostgreSQL provisionada arriba (persistente).
      - key: DATABASE_URL
        fromDatabase:
          name: fialo-db
          property: connectionString
      # Secreto para firmar las sesiones (Render genera un valor aleatorio seguro).
      - key: SESSION_SECRET
        generateValue: true
      # Para activar Claude, agrega tu clave en el panel de Render (Environment):
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: CLAUDE_MODEL
      #   value: claude-haiku-4-5-20251001
