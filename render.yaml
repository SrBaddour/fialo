# Blueprint de Render — despliega Fíalo como Web Service.
# Render leerá este archivo automáticamente al crear el servicio desde el repo.
services:
  - type: web
    name: fialo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Para activar Claude, agrega tu clave en el panel de Render (Environment):
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: CLAUDE_MODEL
      #   value: claude-haiku-4-5-20251001
